<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>The Garden Gate · Caper starter</title>
        <style>
            body {
                margin: 0;
                background: #142d30;
                color: #faf3de;
                font: 16px system-ui;
            }
            header {
                display: flex;
                align-items: center;
                gap: 20px;
                padding: 12px 24px;
            }
            h1 {
                font-size: 19px;
                margin: 0;
            }
            button {
                margin-left: auto;
                padding: 10px 16px;
                cursor: pointer;
            }
            #game {
                height: calc(100dvh - 70px);
            }
            canvas {
                display: block;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>The Garden Gate</h1>
            <span id="status" role="status" aria-live="polite">Click to explore. Progress saves automatically.</span
            ><button id="retry-save" hidden>Retry saving</button> <button id="restart">Start over</button>
        </header>
        <main id="game" aria-label="Point-and-click adventure"></main>
        <script type="module" src="./main.js"></script>
    </body>
</html>
